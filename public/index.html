<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>✨ AI Text-to-SQL Generator</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-color: #f4f7f9;
      --container-bg: #ffffff;
      --primary-color: #4a90e2;
      --primary-hover: #357ABD;
      --text-color: #333;
      --subtle-text: #777;
      --border-color: #e0e0e0;
      --shadow-color: rgba(0, 0, 0, 0.08);
      --error-color: #e74c3c;
      --code-bg: #282c34;
      --success-color: #2ecc71;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 700px;
      background: var(--container-bg);
      padding: 30px 40px;
      border-radius: 16px;
      box-shadow: 0 8px M30px var(--shadow-color);
      display: flex;
      flex-direction: column;
      gap: 25px;
      /* Animation for page load */
      opacity: 0;
      transform: translateY(20px);
      animation: fadeInUp 0.6s 0.2s ease-out forwards;
    }

    @keyframes fadeInUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h1 {
      text-align: center;
      font-weight: 600;
      font-size: 28px;
      background: linear-gradient(90deg, var(--primary-color), #8e44ad);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .input-area {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    textarea {
      width: 100%;
      height: 100px;
      padding: 15px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      font-size: 16px;
      font-family: 'Poppins', sans-serif;
      resize: vertical;
      transition: border-color 0.3s, box-shadow 0.3s;
    }

    textarea::placeholder {
      color: var(--subtle-text);
    }

    textarea:focus {
      outline: none;
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.2);
    }

    button#generateBtn {
      background: linear-gradient(90deg, var(--primary-color), #63b2f5);
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 500;
      transition: transform 0.2s, box-shadow 0.2s, background-color 0.3s;
      align-self: flex-start;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    button#generateBtn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(74, 144, 226, 0.3);
    }
    
    button#generateBtn:disabled {
      background: #bdc3c7;
      cursor: not-allowed;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none; /* Hidden by default */
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .output-container {
      background: var(--code-bg);
      border-radius: 10px;
      padding: 5px 20px 20px 20px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
    }

    .output-header {
      color: #9da5b4;
      font-size: 14px;
      padding: 15px 0;
      border-bottom: 1px solid #444;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    button#copyBtn {
      background: #3a404a;
      color: #abb2bf;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s;
      display: none; /* Hidden by default */
    }
    
    button#copyBtn:hover {
      background-color: #4f5663;
      color: #fff;
    }

    button#copyBtn.copied {
        background-color: var(--success-color);
        border-color: var(--success-color);
        color: white;
    }

    pre {
      background: none;
      color: #abb2bf;
      padding: 0;
      margin: 0;
      white-space: pre-wrap;
      word-wrap: break-word;
      font-family: 'SF Mono', 'Consolas', 'Menlo', monospace;
      font-size: 15px;
    }
    
    .error {
      color: var(--error-color);
      background-color: rgba(231, 76, 60, 0.1);
      border-left: 4px solid var(--error-color);
      padding: 12px;
      border-radius: 4px;
      display: none;
    }

    footer {
        text-align: center;
        color: var(--subtle-text);
        font-size: 14px;
        margin-top: -10px; /* Adjust spacing */
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>✨ AI Text-to-SQL Generator</h1>
    
    <div class="input-area">
      <textarea id="queryInput" placeholder="e.g., Show me all users from California ordered by last name"></textarea>
      <button id="generateBtn" onclick="generateSQL()">
        <span class="btn-text">Generate SQL</span>
        <div class="spinner"></div>
      </button>
    </div>
    
    <div class="output-container">
      <div class="output-header">
        <span>Generated SQL</span>
        <button id="copyBtn" onclick="copySQL()">📋 Copy</button>
      </div>
      <pre><code id="output" class="language-sql">Your SQL query will appear here...</code></pre>
    </div>

    <p class="error" id="error"></p>
    
    <footer>Developed by Venkat</footer>
  </div>

  <script>
    // --- UI Element References ---
    const queryInput = document.getElementById("queryInput");
    const outputCode = document.getElementById("output");
    const errorEl = document.getElementById("error");
    const generateBtn = document.getElementById("generateBtn");
    const btnText = generateBtn.querySelector('.btn-text');
    const spinner = generateBtn.querySelector('.spinner');
    const copyBtn = document.getElementById("copyBtn");

    /**
     * Simulates a typewriter effect for displaying text.
     * @param {HTMLElement} element - The element to type into.
     * @param {string} text - The text to display.
     * @param {number} delay - The delay between characters in ms.
     */
    function typewriter(element, text, delay = 20) {
      return new Promise(resolve => {
        element.textContent = '';
        let i = 0;
        function type() {
          if (i < text.length) {
            element.textContent += text.charAt(i);
            i++;
            setTimeout(type, delay);
          } else {
            resolve();
          }
        }
        type();
      });
    }
    
    /**
     * Copies the generated SQL from the output block to the clipboard.
     */
    async function copySQL() {
        const sqlToCopy = outputCode.textContent;
        try {
            await navigator.clipboard.writeText(sqlToCopy);
            copyBtn.textContent = '✅ Copied!';
            copyBtn.classList.add('copied');
            setTimeout(() => {
                copyBtn.textContent = '📋 Copy';
                copyBtn.classList.remove('copied');
            }, 2000);
        } catch (err) {
            console.error('Failed to copy text: ', err);
            copyBtn.textContent = '❌ Failed';
        }
    }

    /**
     * Main function to generate SQL from user input.
     */
    async function generateSQL() {
      const query = queryInput.value.trim();

      if (!query) {
        errorEl.textContent = "⚠️ Please enter a query in plain English.";
        errorEl.style.display = 'block';
        return;
      }
      
      // --- Reset UI for new request ---
      errorEl.style.display = 'none';
      copyBtn.style.display = 'none';
      generateBtn.disabled = true;
      btnText.textContent = 'Generating...';
      spinner.style.display = 'block';
      outputCode.textContent = "";

      try {
        const response = await fetch("/sql", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ query })
        });

        const data = await response.json();
        
        if (response.ok && data.sql) {
          let cleanSQL = data.sql.replace(/```sql|```/g, '').trim();
          
          // Use the typewriter effect to display the result
          await typewriter(outputCode, cleanSQL);

          // Apply syntax highlighting after typing is complete
          hljs.highlightElement(outputCode);
          copyBtn.style.display = 'block';
        } else {
          throw new Error(data.error || "An unknown error occurred.");
        }
      } catch (err) {
        errorEl.textContent = "❌ Error: " + err.message;
        errorEl.style.display = 'block';
        outputCode.textContent = "Failed to generate SQL.";
      } finally {
        // --- Restore UI state ---
        generateBtn.disabled = false;
        btnText.textContent = 'Generate SQL';
        spinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
